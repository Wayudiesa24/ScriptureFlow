name: Android APK (debug)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Test Bible navigation
        run: npm test
      - name: Bundle complete public-domain Bible for offline access
        run: npm run bible:prepare
      - name: Build the React reader and study companion
        run: npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync native Android plugins
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ScriptureFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
